<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Story 071 echo-rounds viability probe</title>
<style>
  body { background: #000; color: #0f0; font-family: monospace; margin: 8px; }
  canvas { background: #050505; display: block; }
  #out { white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="c" width="640" height="400"></canvas>
<pre id="out">probe running...</pre>
<script>
"use strict";
/* Story 071 echo-rounds viability probe. Single file, no build, no dependency.
 * Mechanic: dark arena, each shot emits one transient light pulse, hits count
 * only on lit targets, firing reveals the shooter.
 * Self-driving: scripted move/look/fire schedule on load, measures frame
 * times with the light-ammo loop running, counts input drop/desync, then
 * POSTs JSON to /results. Modes via query string:
 *   (none)      full mechanic loop (light-ammo on)
 *   ?empty=1    empty scene, no light pulses (Scenario 4 control)
 *   ?sabotage=1 full loop plus 50ms busy-wait per frame (negative control;
 *               harness must FAIL this run or the harness is a tautology)
 */
var q = new URLSearchParams(location.search);
var EMPTY = q.get("empty") === "1";
var SABOTAGE = q.get("sabotage") === "1";
/* Story 089 mouse-leg mode (?mouseleg=1): pointer-lock look (yaw/pitch) plus
 * click-to-shoot (one click emits one light pulse, fades) plus the lit-target
 * hit gate (hits only on lit targets, shooter revealed per shot). Default
 * mechanic-loop/empty/sabotage paths below are unchanged. */

var MOUSELEG = q.get("mouseleg") === "1";
var LOOK_SENS = 0.0025, PULSE_TTL = 140, WARMUP_N = 30;

var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");
var out = document.getElementById("out");

var player = { x: 320, y: 200, yaw: 0, pitch: 0, visibleUntil: 0 };
var keys = {};
var pulses = [];
var targets = [];
for (var i = 0; i < 12; i++) {
  targets.push({ x: 40 + (i * 53) % 560, y: 40 + (i * 97) % 320, litUntil: 0 });
}
var shots = 0, gatedHits = 0, gatedMisses = 0, revealCount = 0;
/* Story 089 mouse-leg counters. Gate stats only count shots fired while the
 * gate is armed (scripted aimed phase); stress-phase shots are unevaluated. */
var GATE_T = null;
var lookDY = 0, lookAppliedDX = 0, lookAppliedDY = 0;
var lookInjected = 0, lookApplied = 0;
var clickShots = 0, pulsesFaded = 0, unevaluatedShots = 0;
var litShots = 0, litHits = 0, unlitShots = 0, unlitHits = 0;
var gateArmed = false, stressDone = false, fireMoveLookSurvived = false;
var gateFired = { t1: false, t2: false, t3: false, t4: false };
var lastClickElapsed = -400, observedAtLastShot = 0;
if (MOUSELEG) {
  targets[0].x = 500; targets[0].y = 200; targets[0].litUntil = 0;
  targets[1].x = 140; targets[1].y = 320; targets[1].litUntil = 0;
  GATE_T = targets[0];
  player.yaw = Math.PI / 2; player.pitch = 0;
}

/* input accounting: injected edges vs listener-observed edges */
var injected = 0, observed = 0;
var lastSeenKey = {};
var transitions = [];
window.addEventListener("keydown", function (e) {
  if (!lastSeenKey[e.code]) { lastSeenKey[e.code] = true; observed++; }
  keys[e.code] = true;
});
window.addEventListener("keyup", function (e) {
  if (lastSeenKey[e.code]) { lastSeenKey[e.code] = false; observed++; }
  keys[e.code] = false;
});
function injectEdge(code, down) {
  injected++;
  transitions.push({ key: code, type: down ? "down" : "up" });
  window.dispatchEvent(new KeyboardEvent(down ? "keydown" : "keyup", { code: code }));
}

/* held-phase agreement: each 500ms phase holds one move key; count frames
 * where the poll saw the expected key down */
var holdPhases = [];
var curPhase = -1;
/* sub-frame taps: injected down+up between frames. Event listeners see both
 * edges; a poll-only sampler cannot. Reported separately (informational). */
var qTaps = 0, qTapsEventSeen = 0, qPollHits = 0, qWasHeld = false;
var qObservedDown = false;
window.addEventListener("keydown", function (e) {
  if (e.code === "KeyQ") qObservedDown = true;
});

/* pointer lock + gamepad availability (recorded, not assumed) */
var pointerLockState = "not-attempted";
var gamepadsSeen = 0;
var gamepadSamples = 0, gamepadEmptySamples = 0;
try {
  canvas.requestPointerLock = canvas.requestPointerLock || canvas.mozRequestPointerLock;
  if (canvas.requestPointerLock) {
    pointerLockState = "request-sent";
    document.addEventListener("pointerlockchange", function () {
      pointerLockState = (document.pointerLockElement === canvas) ? "locked" : "changed-lost";
    });
    document.addEventListener("pointerlockerror", function () { pointerLockState = "error"; });
    canvas.requestPointerLock();
  } else { pointerLockState = "unsupported"; }
} catch (err) { pointerLockState = "threw:" + String(err && err.name || err); }
var lookDX = 0;
window.addEventListener("mousemove", function (e) {
  lookDX += (e.movementX || 0);
  lookDY += (e.movementY || 0);
});
/* Story 089: click-to-shoot. One mousedown emits exactly one light pulse via
 * mouselegFire. Synthetic clicks dispatched by the scripted driver travel this
 * same path (headless Pointer Lock reports error per the Story 071 known
 * limitation, so look/click input is driven synthetically). */
window.addEventListener("mousedown", function () {
  if (!MOUSELEG) return;
  clickShots++;
  mouselegFire(performance.now());
});
function pollGamepad() {
  gamepadSamples++;
  var gps = [];
  try { gps = navigator.getGamepads ? navigator.getGamepads() : []; } catch (e) { gps = []; }
  var any = false;
  for (var i = 0; i < gps.length; i++) { if (gps[i] && gps[i].connected) { any = true; break; } }
  if (any) gamepadsSeen++; else gamepadEmptySamples++;
}

function fire(now) {
  shots++;
  player.visibleUntil = now + 150;
  revealCount++;
  if (EMPTY) return;
  pulses.push({ x: player.x, y: player.y, r: 130, born: now, ttl: 140 });
  for (var i = 0; i < targets.length; i++) {
    var t = targets[i];
    var dx = t.x - player.x, dy = t.y - player.y;
    if (dx * dx + dy * dy < 130 * 130) { t.litUntil = now + 140; }
  }
  var hx = player.x + Math.cos(player.yaw) * 200;
  var hy = player.y + Math.sin(player.yaw) * 200;
  var hit = false;
  for (var j = 0; j < targets.length; j++) {
    var u = targets[j];
    var ex = u.x - hx, ey = u.y - hy;
    if (ex * ex + ey * ey < 24 * 24) {
      if (now < u.litUntil) { gatedHits++; hit = true; }
      break;
    }
  }
  if (!hit) gatedMisses++;
}

/* Story 089 mouse-leg fire path (default-mode fire() above is untouched).
 * Hit is decided against pre-shot lit state, then the pulse lights targets
 * along the ray corridor, then fades. Every shot sets the shooter-revealed
 * flag. Gate stats count only while gateArmed (scripted aimed phase). */
function mouselegFire(now) {
  shots++;
  player.visibleUntil = now + PULSE_TTL + 10;
  revealCount++;
  var hx = player.x + Math.cos(player.yaw) * 200;
  var hy = player.y + Math.sin(player.yaw) * 200;
  if (gateArmed) {
    var aimed = null;
    for (var k = 0; k < 2; k++) {
      var u = targets[k];
      var ex = u.x - hx, ey = u.y - hy;
      if (ex * ex + ey * ey < 24 * 24) { aimed = u; break; }
    }
    if (aimed && now < aimed.litUntil) { litShots++; litHits++; }
    else { unlitShots++; }
  } else { unevaluatedShots++; }
  pulses.push({ x: player.x, y: player.y, r: 130, born: now, ttl: PULSE_TTL });
  var cy = Math.cos(player.yaw), sy = Math.sin(player.yaw);
  for (var i = 0; i < targets.length; i++) {
    var t = targets[i];
    var rx = t.x - player.x, ry = t.y - player.y;
    var along = rx * cy + ry * sy;
    var perp = Math.abs(-rx * sy + ry * cy);
    if (along >= 0 && along <= 260 && perp <= 50) { t.litUntil = now + PULSE_TTL; }
  }
}

function synthLook(dx, dy) {
  lookInjected++;
  var e = new Event("mousemove");
  e.movementX = dx; e.movementY = dy;
  window.dispatchEvent(e);
}

function synthClick() {
  window.dispatchEvent(new MouseEvent("mousedown"));
}

/* Story 089 scripted driver: 0-5 s simultaneous fire-move-look stress
 * (hold W, synthetic look every frame, click every 400 ms, gate disarmed),
 * then a deterministic aimed gate phase (unlit miss, lit hit, faded miss,
 * away miss), then a post-fire move window proving no input lockup. */
function mouselegDrive(now, elapsed) {
  if (elapsed < 5000) {
    if (!keys.KeyW) injectEdge("KeyW", true);
    synthLook(3, -1);
    if (elapsed - lastClickElapsed >= 400) {
      lastClickElapsed = elapsed;
      synthClick();
    }
  } else if (!stressDone) {
    stressDone = true;
    if (keys.KeyW) injectEdge("KeyW", false);
    fireMoveLookSurvived =
      (shots > 0 && lookApplied > 0 && (injected - observed) === 0);
    player.x = 320; player.y = 200; player.yaw = 0;
    GATE_T.litUntil = 0;
    gateArmed = true;
  }
  if (stressDone) {
    if (!gateFired.t1 && elapsed >= 5200) {
      gateFired.t1 = true;
      player.x = 320; player.y = 200; player.yaw = 0;
      GATE_T.litUntil = 0;
      synthClick();
    }
    if (!gateFired.t2 && elapsed >= 5260) { gateFired.t2 = true; synthClick(); }
    if (!gateFired.t3 && elapsed >= 5700) { gateFired.t3 = true; synthClick(); }
    if (!gateFired.t4 && elapsed >= 5760) {
      gateFired.t4 = true;
      player.yaw = Math.PI;
      synthClick();
      observedAtLastShot = observed;
    }
    if (elapsed >= 8000 && elapsed < 10000) {
      if (!keys.KeyD) injectEdge("KeyD", true);
    } else if (keys.KeyD) { injectEdge("KeyD", false); }
  }
  if (lookDX || lookDY) {
    lookApplied++;
    lookAppliedDX += lookDX; lookAppliedDY += lookDY;
    player.yaw += lookDX * LOOK_SENS;
    player.pitch += lookDY * LOOK_SENS;
    if (player.pitch > 1.2) player.pitch = 1.2;
    if (player.pitch < -1.2) player.pitch = -1.2;
    lookDX = 0; lookDY = 0;
  }
  if (keys.KeyW) player.y += 1.2;
  if (keys.KeyS) player.y -= 1.2;
  if (keys.KeyA) player.x -= 1.2;
  if (keys.KeyD) player.x += 1.2;
  player.x = Math.max(20, Math.min(620, player.x));
  player.y = Math.max(20, Math.min(380, player.y));
}

function draw(now) {
  ctx.fillStyle = "#050505";
  ctx.fillRect(0, 0, 640, 400);
  for (var p = 0; p < pulses.length; p++) {
    var pu = pulses[p];
    var age = now - pu.born;
    if (age < pu.ttl) {
      /* Story 089: pulse fades over its life in mouse-leg mode. */
      var fade = MOUSELEG ? (1 - age / pu.ttl) : 1;
      var g = ctx.createRadialGradient(pu.x, pu.y, 4, pu.x, pu.y, pu.r);
      g.addColorStop(0, "rgba(255,240,180," + (0.85 * fade).toFixed(3) + ")");
      g.addColorStop(1, "rgba(255,240,180,0)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 640, 400);
    }
  }
  for (var i = 0; i < targets.length; i++) {
    var t = targets[i];
    ctx.fillStyle = (now < t.litUntil) ? "#ffdd66" : "#331f00";
    ctx.fillRect(t.x - 8, t.y - 8, 16, 16);
  }
  ctx.fillStyle = (now < player.visibleUntil) ? "#ff4444" : "#226622";
  ctx.beginPath();
  ctx.arc(player.x, player.y, 10, 0, 6.2832);
  ctx.fill();
  ctx.strokeStyle = "#888";
  ctx.beginPath();
  ctx.moveTo(player.x, player.y);
  ctx.lineTo(player.x + Math.cos(player.yaw) * 30, player.y + Math.sin(player.yaw) * 30);
  ctx.stroke();
}

var frameTimes = [];
var lastT = 0, t0 = 0;
var RUN_MS = MOUSELEG ? 12000 : 10000;
var fireAcc = 0;
var slowFrames = 0;
var done = false;
var lastTapBucket = -1;

function step(now) {
  if (!t0) t0 = now;
  if (lastT) frameTimes.push(now - lastT);
  lastT = now;

  var elapsed = now - t0;
  if (MOUSELEG) { mouselegDrive(now, elapsed); }
  else {
  var phase = Math.floor(elapsed / 500) % 4;
  var moveCode = ["KeyW", "KeyA", "KeyS", "KeyD"][phase];
  if (phase !== curPhase) {
    if (curPhase >= 0) {
      var prev = ["KeyW", "KeyA", "KeyS", "KeyD"][curPhase];
      if (keys[prev]) injectEdge(prev, false);
    }
    curPhase = phase;
    holdPhases.push({ code: moveCode, frames: 0, sawDown: 0 });
  }
  if (!keys[moveCode]) injectEdge(moveCode, true);
  var hp = holdPhases[holdPhases.length - 1];
  hp.frames++;
  if (keys[moveCode]) hp.sawDown++;

  /* sub-frame tap stressor: one down+up pair per 100ms bucket */
  var bucket = Math.floor(elapsed / 100);
  if (bucket !== lastTapBucket) {
    lastTapBucket = bucket;
    qObservedDown = false;
    qTaps++;
    injectEdge("KeyQ", true);
    injectEdge("KeyQ", false);
    if (qObservedDown) qTapsEventSeen++;
  }
  if (keys.KeyQ) qPollHits++;
  qWasHeld = !!keys.KeyQ;

  player.yaw += 0.02 + lookDX * 0.001; lookDX = 0;
  if (keys.KeyW) player.y += 1.2;
  if (keys.KeyS) player.y -= 1.2;
  if (keys.KeyA) player.x -= 1.2;
  if (keys.KeyD) player.x += 1.2;
  player.x = Math.max(20, Math.min(620, player.x));
  player.y = Math.max(20, Math.min(380, player.y));

  fireAcc += 16;
  if (fireAcc >= 120) { fireAcc = 0; fire(now); }

  } /* end default-mode middle; mouse-leg schedule runs in mouselegDrive */
  var keptPulses = [];
  for (var fi = 0; fi < pulses.length; fi++) {
    if (now - pulses[fi].born < pulses[fi].ttl) keptPulses.push(pulses[fi]);
    else pulsesFaded++;
  }
  pulses = keptPulses;

  pollGamepad();
  draw(now);

  if (SABOTAGE) {
    var sb = performance.now();
    while (performance.now() - sb < 50) { /* busy wait */ }
  }

  if (frameTimes[frameTimes.length - 1] > 33.4) slowFrames++;

  if (elapsed < RUN_MS) { requestAnimationFrame(step); }
  else { finish(now); }
}

function percentile(arr, p) {
  if (!arr.length) return 0;
  var s = arr.slice().sort(function (a, b) { return a - b; });
  return s[Math.min(s.length - 1, Math.floor(p * s.length))];
}

function finish(now) {
  if (done) return; done = true;
  ["KeyW", "KeyA", "KeyS", "KeyD"].forEach(function (c) {
    if (keys[c]) injectEdge(c, false);
  });
  var n = frameTimes.length;
  var sum = frameTimes.reduce(function (a, b) { return a + b; }, 0);
  var mean = n ? sum / n : 0;
  var fps = mean > 0 ? 1000 / mean : 0;
  var agreeFrames = 0, agreeSaw = 0;
  holdPhases.forEach(function (h) { agreeFrames += h.frames; agreeSaw += h.sawDown; });
  var stuck = 0;
  ["KeyW", "KeyA", "KeyS", "KeyD", "KeyQ"].forEach(function (c) {
    if (keys[c]) stuck++;
  });
  var result = {
    mode: EMPTY ? "empty-scene" : (SABOTAGE ? "sabotage" : "mechanic-loop"),
    runMs: Math.round(now - t0),
    frames: n,
    frameMeanMs: Math.round(mean * 100) / 100,
    frameP50Ms: Math.round(percentile(frameTimes, 0.50) * 100) / 100,
    frameP95Ms: Math.round(percentile(frameTimes, 0.95) * 100) / 100,
    frameP99Ms: Math.round(percentile(frameTimes, 0.99) * 100) / 100,
    fpsMean: Math.round(fps * 10) / 10,
    slowFramesOver33ms: slowFrames,
    shots: shots,
    pulsesEmitted: EMPTY ? 0 : shots,
    gatedHits: gatedHits,
    gatedMisses: gatedMisses,
    shooterReveals: revealCount,
    inputInjected: injected,
    inputObserved: observed,
    inputDrops: Math.max(0, injected - observed),
    holdPhaseFrames: agreeFrames,
    holdPhaseSawDown: agreeSaw,
    holdAgreementPct: agreeFrames ? Math.round(agreeSaw / agreeFrames * 1000) / 10 : 0,
    subframeTaps: qTaps,
    subframeTapsEventSeen: qTapsEventSeen,
    subframeTapsPollSeen: qPollHits,
    pointerLock: pointerLockState,
    gamepadSamples: gamepadSamples,
    gamepadNonEmpty: gamepadsSeen,
    gamepadEmpty: gamepadEmptySamples,
    userAgent: navigator.userAgent
  };
  if (MOUSELEG) {
    /* Story 074 settlement: warmup first 30 excluded, count at least 600,
     * p95 checked against the 15.84-17.50 ms band, slow frames over 33 ms. */
    var counted = frameTimes.slice(WARMUP_N);
    var csum = counted.reduce(function (a, b) { return a + b; }, 0);
    var cmean = counted.length ? csum / counted.length : 0;
    var cslow = 0, ci;
    for (ci = 0; ci < counted.length; ci++) {
      if (counted[ci] > 33) cslow++;
    }
    result.mode = "mouse-leg";
    result.framesTotal = n;
    result.warmupExcluded = WARMUP_N;
    result.framesCounted = counted.length;
    result.frameMeanMsCounted =
      Math.round(cmean * 100) / 100;
    result.frameP50MsCounted =
      Math.round(percentile(counted, 0.50) * 100) / 100;
    result.frameP95MsCounted =
      Math.round(percentile(counted, 0.95) * 100) / 100;
    result.frameP99MsCounted =
      Math.round(percentile(counted, 0.99) * 100) / 100;
    result.slowFramesOver33ms = cslow;
    result.lookEventsInjected = lookInjected;
    result.lookEventsApplied = lookApplied;
    result.lookYawDelta =
      Math.round(lookAppliedDX * LOOK_SENS * 1000) / 1000;
    result.lookPitchDelta =
      Math.round(lookAppliedDY * LOOK_SENS * 1000) / 1000;
    result.fireMoveLookSurvived = fireMoveLookSurvived;
    result.stuckInputs = stuck;
    result.clickShots = clickShots;
    result.pulsesFaded = pulsesFaded;
    result.litShots = litShots;
    result.litHits = litHits;
    result.litHitRate = litShots ? litHits / litShots : 0;
    result.unlitShots = unlitShots;
    result.unlitHits = unlitHits;
    result.unevaluatedShots = unevaluatedShots;
    result.postFireInput = observed - observedAtLastShot;
  }
  out.textContent = JSON.stringify(result, null, 2);
  window.__probeResult = result;
  var payload = JSON.stringify(result);
  try {
    if (navigator.sendBeacon) {
      navigator.sendBeacon("/results", payload);
    } else {
      fetch("/results", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: payload
      });
    }
  } catch (e) { /* harness falls back to DOM scrape */ }
  /* keepalive: hold the page open briefly so sendBeacon/fetch lands */
  var tEnd = performance.now();
  while (performance.now() - tEnd < 1500) { /* drain */ }
}

requestAnimationFrame(step);
</script>
</body>
</html>
