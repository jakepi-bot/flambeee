<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 Flambeee Games</title>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --accent: #e94560;
    --text: #eee;
    --border: #222;
    --card-hover: #1a4a7a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 24px 16px;
  }

  h1 {
    font-size: 2rem;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }

  h1 .flame { color: var(--accent); }

  .subtitle {
    color: #888;
    margin-bottom: 32px;
    font-size: 1rem;
  }

  /* Game grid */
  .game-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    width: 100%;
    max-width: 800px;
    margin-bottom: 32px;
  }

  .game-card {
    background: var(--surface);
    border-radius: 12px;
    padding: 24px;
    border: 1px solid var(--border);
    transition: transform 0.2s, border-color 0.2s;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .game-card:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
  }

  .game-icon {
    font-size: 3.5rem;
    margin-bottom: 16px;
  }

  .game-name {
    font-size: 1.4rem;
    font-weight: bold;
    margin-bottom: 8px;
    color: var(--text);
  }

  .game-desc {
    color: #aaa;
    font-size: 0.9rem;
    line-height: 1.4;
    margin-bottom: 20px;
  }

  .play-btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 32px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.1s, background 0.15s;
  }

  .play-btn:hover {
    background: #ff5a75;
  }

  .play-btn:active {
    transform: scale(0.95);
  }

  footer {
    margin-top: auto;
    font-size: 0.8rem;
    color: #555;
    text-align: center;
  }

  footer a {
    color: var(--accent);
    text-decoration: none;
  }

  /* Mobile optimization */
  @media (max-width: 600px) {
    .game-grid {
      grid-template-columns: 1fr;
    }

    h1 {
      font-size: 1.6rem;
    }

    .game-icon {
      font-size: 3rem;
    }
  }
</style>
</head>
<body>

<h1><span class="flame">🔥</span> Flambeee Games</h1>
<p class="subtitle">Pick your poison</p>

<div class="game-grid">
  <a href="minesweeper.html" class="game-card">
    <div class="game-icon">💣</div>
    <div class="game-name">Minesweeper</div>
    <div class="game-desc">Classic mine-hunting puzzle. Clear the board without blowing up!</div>
    <button class="play-btn">Play</button>
  </a>

  <a href="simon.html" class="game-card">
    <div class="game-icon">🧠</div>
    <div class="game-name">Simon</div>
    <div class="game-desc">Memory challenge. Repeat the pattern and test your recall!</div>
    <button class="play-btn">Play</button>
  </a>

  <a href="2048.html" class="game-card">
    <div class="game-icon">🔢</div>
    <div class="game-name">2048</div>
    <div class="game-desc">Merge the tiles. Reach 2048 and chase a new high score!</div>
    <button class="play-btn">Play</button>
  </a>
</div>

<footer>
  Built by <a href="https://github.com/jakepi-bot/flambeee">Flambeee 🔥</a> &mdash; <a href="https://github.com/jakepi84">CEO</a>
</footer>

</body>
</html>
