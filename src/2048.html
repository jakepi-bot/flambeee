<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Flambeee 2048</title>
<style>
  :root {
    --bg: #1a1a2e;
    --panel: #22223a;
    --panel-2: #2a2a4a;
    --text: #eee;
    --muted: #9aa0a6;
    --accent: #e94560;
    --cell-gap: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    touch-action: manipulation;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
  }
  header { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; width: 100%; max-width: 460px; }
  h1 { font-size: 1.6rem; }
  h1 span { color: var(--accent); }
  .stat-box { display: flex; gap: 10px; margin-left: auto; }
  .stat {
    background: var(--panel);
    border-radius: 8px;
    padding: 6px 12px;
    text-align: center;
    min-width: 72px;
  }
  .stat .label { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .stat .value { font-size: 1.2rem; font-weight: 700; }
  .controls { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; width: 100%; max-width: 460px; }
  .controls label { font-size: 0.8rem; color: var(--muted); }
  select, button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid #333;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  button.restart { background: var(--accent); color: #000; font-weight: 700; border: none; margin-left: auto; }
  .board-wrap {
    position: relative;
    background: var(--panel);
    border-radius: 12px;
    padding: var(--cell-gap);
    max-width: 460px;
    width: 100%;
    touch-action: none;
  }
  .grid {
    display: grid;
    gap: var(--cell-gap);
    grid-template-columns: repeat(4, 1fr);
    aspect-ratio: 1 / 1;
  }
  .grid.hard { grid-template-columns: repeat(5, 1fr); }
  .cell {
    background: #1e1e36;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    font-weight: 800;
    color: #fff;
    transition: transform 0.1s ease, background 0.12s ease;
    position: relative;
  }
  .cell[data-v="2"]   { background: #2a2a4a; }
  .cell[data-v="4"]   { background: #3a3a5a; }
  .cell[data-v="8"]   { background: #6d4c00; }
  .cell[data-v="16"]  { background: #7a5700; }
  .cell[data-v="32"]  { background: #8f6500; }
  .cell[data-v="64"]  { background: #a57300; }
  .cell[data-v="128"] { background: #c08a00; }
  .cell[data-v="256"] { background: #d99a00; }
  .cell[data-v="512"] { background: #f0ab00; color: #000; }
  .cell[data-v="1024"]{ background: #e94560; color: #fff; }
  .cell[data-v="2048"]{ background: #ff5a75; color: #fff; }
  .cell.merged { transform: scale(1.12); }
  .cell.new { animation: pop 0.18s ease; }
  @keyframes pop { from { transform: scale(0.5); opacity: 0.4; } to { transform: scale(1); opacity: 1; } }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(26,26,46,0.9);
    border-radius: 12px;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-align: center;
    z-index: 5;
  }
  .overlay.show { display: flex; }
  .overlay h2 { font-size: 2rem; }
  .overlay p { color: var(--muted); }
  .overlay button { background: var(--accent); color: #000; font-weight: 700; border: none; padding: 10px 20px; font-size: 1rem; }
  .hint { margin-top: 14px; font-size: 0.8rem; color: var(--muted); text-align: center; }
  a.back { color: var(--accent); text-decoration: none; font-size: 0.85rem; margin-bottom: 8px; }
</style>
</head>
<body>
  <a class="back" href="index.html">← Back to Game Hub</a>
  <header>
    <h1>Flambeee <span>2048</span></h1>
    <div class="stat-box">
      <div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="stat"><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>
  </header>
  <div class="controls">
    <label for="size">Board</label>
    <select id="size">
      <option value="4">Classic 4×4</option>
      <option value="5">Hard 5×5</option>
    </select>
    <button class="restart" id="restart">New Game</button>
  </div>
  <div class="board-wrap">
    <div class="grid" id="grid"></div>
    <div class="overlay" id="overlay">
      <h2 id="overlay-title"></h2>
      <p id="overlay-text"></p>
      <button id="overlay-btn">Play Again</button>
    </div>
  </div>
  <div class="hint">Arrow keys / WASD to move · Swipe on mobile · Tiles with the same number merge when they touch</div>

<script>
(function () {
  "use strict";
  var SIZE = 4;
  var board = [];
  var score = 0;
  var best = 0;
  var won = false;
  var over = false;

  var gridEl = document.getElementById("grid");
  var scoreEl = document.getElementById("score");
  var bestEl = document.getElementById("best");
  var overlay = document.getElementById("overlay");
  var overlayTitle = document.getElementById("overlay-title");
  var overlayText = document.getElementById("overlay-text");
  var overlayBtn = document.getElementById("overlay-btn");
  var restartBtn = document.getElementById("restart");
  var sizeSel = document.getElementById("size");

  var STORAGE_KEY = "flambeee-2048-best";
  var SIZE_KEY = "flambeee-2048-size";

  function loadSize() {
    try {
      var s = parseInt(localStorage.getItem(SIZE_KEY), 10);
      if (s === 4 || s === 5) SIZE = s;
    } catch (e) { /* private mode */ }
    sizeSel.value = String(SIZE);
  }

  function saveSize() {
    try { localStorage.setItem(SIZE_KEY, String(SIZE)); } catch (e) { /* private mode */ }
  }

  function loadBest() {
    try { best = parseInt(localStorage.getItem(STORAGE_KEY), 10) || 0; } catch (e) { best = 0; }
    bestEl.textContent = best;
  }

  function saveBest() {
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem(STORAGE_KEY, String(best)); } catch (e) { /* private mode */ }
    }
  }

  function emptyCell() {
    return { value: 0, merged: false, isNew: false };
  }

  function newBoard() {
    var b = [];
    for (var r = 0; r < SIZE; r++) {
      b[r] = [];
      for (var c = 0; c < SIZE; c++) b[r][c] = emptyCell();
    }
    return b;
  }

  function randomTile() {
    return (Math.random() < 0.9) ? 2 : 4;
  }

  function addRandomTile() {
    var empties = [];
    for (var r = 0; r < SIZE; r++)
      for (var c = 0; c < SIZE; c++)
        if (board[r][c].value === 0) empties.push([r, c]);
    if (!empties.length) return false;
    var pick = empties[Math.floor(Math.random() * empties.length)];
    board[pick[0]][pick[1]] = { value: randomTile(), merged: false, isNew: true };
    return true;
  }

  function reset() {
    score = 0;
    won = false;
    over = false;
    scoreEl.textContent = "0";
    board = newBoard();
    addRandomTile();
    addRandomTile();
    overlay.classList.remove("show");
    render();
  }

  function render() {
    gridEl.className = "grid" + (SIZE === 5 ? " hard" : "");
    gridEl.style.gridTemplateColumns = "repeat(" + SIZE + ", 1fr)";
    gridEl.innerHTML = "";
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        var cell = document.createElement("div");
        cell.className = "cell";
        var v = board[r][c].value;
        if (v > 0) {
          cell.textContent = v;
          cell.dataset.v = String(v);
          if (board[r][c].merged) cell.classList.add("merged");
          if (board[r][c].isNew) cell.classList.add("new");
        }
        gridEl.appendChild(cell);
      }
    }
    // clear transient flags
    for (var r2 = 0; r2 < SIZE; r2++)
      for (var c2 = 0; c2 < SIZE; c2++) {
        board[r2][c2].merged = false;
        board[r2][c2].isNew = false;
      }
  }

  // Slide a single line toward index 0, return points gained + moved flag + merged positions
  function slideLine(line) {
    var filtered = line.filter(function (v) { return v > 0; });
    var out = [];
    var gained = 0;
    var moved = false;
    var mergedIdx = [];
    for (var i = 0; i < filtered.length; i++) {
      if (i + 1 < filtered.length && filtered[i] === filtered[i + 1]) {
        var merged = filtered[i] * 2;
        out.push(merged);
        gained += merged;
        mergedIdx.push(out.length - 1);
        i++; // skip the paired tile
        moved = true;
      } else {
        out.push(filtered[i]);
      }
    }
    while (out.length < SIZE) out.push(0);
    if (line.join(",") !== out.join(",")) moved = true;
    return { line: out, gained: gained, moved: moved, mergedIdx: mergedIdx };
  }

  function move(direction) {
    if (over) return false;
    var movedAny = false;
    var gained = 0;
    var mergedCells = [];

    if (direction === "left" || direction === "right") {
      for (var r = 0; r < SIZE; r++) {
        var row = [];
        for (var c = 0; c < SIZE; c++) row.push(board[r][c].value);
        if (direction === "right") row.reverse();
        var res = slideLine(row);
        if (direction === "right") res.line.reverse();
        gained += res.gained;
        if (res.moved) movedAny = true;
        for (var c2 = 0; c2 < SIZE; c2++) board[r][c2].value = res.line[c2];
        for (var mi = 0; mi < res.mergedIdx.length; mi++) {
          var idx = res.mergedIdx[mi];
          var col = (direction === "right") ? SIZE - 1 - idx : idx;
          mergedCells.push([r, col]);
        }
      }
    } else {
      for (var c = 0; c < SIZE; c++) {
        var col = [];
        for (var r = 0; r < SIZE; r++) col.push(board[r][c].value);
        if (direction === "down") col.reverse();
        var res2 = slideLine(col);
        if (direction === "down") res2.line.reverse();
        gained += res2.gained;
        if (res2.moved) movedAny = true;
        for (var r2 = 0; r2 < SIZE; r2++) board[r2][c].value = res2.line[r2];
        for (var mi2 = 0; mi2 < res2.mergedIdx.length; mi2++) {
          var idx2 = res2.mergedIdx[mi2];
          var row2 = (direction === "down") ? SIZE - 1 - idx2 : idx2;
          mergedCells.push([row2, c]);
        }
      }
    }

    if (!movedAny) {
      checkGameOver();
      return false;
    }

    score += gained;
    scoreEl.textContent = score;
    saveBest();

    // Mark only the tiles that actually merged for the pulse animation
    for (var m = 0; m < mergedCells.length; m++) {
      board[mergedCells[m][0]][mergedCells[m][1]].merged = true;
    }

    addRandomTile();
    checkWin();
    checkGameOver();
    render();
    return true;
  }

  function has2048() {
    for (var r = 0; r < SIZE; r++)
      for (var c = 0; c < SIZE; c++)
        if (board[r][c].value === 2048) return true;
    return false;
  }

  function checkWin() {
    if (!won && has2048()) {
      won = true;
      showOverlay("You win! 🎉", "You reached 2048. Keep going for a higher score, or start fresh.");
    }
  }

  function canMove() {
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        if (board[r][c].value === 0) return true;
        if (c + 1 < SIZE && board[r][c].value === board[r][c + 1].value) return true;
        if (r + 1 < SIZE && board[r][c].value === board[r + 1][c].value) return true;
      }
    }
    return false;
  }

  function checkGameOver() {
    if (!canMove()) {
      over = true;
      showOverlay("Game Over", "No moves left. Final score: " + score + (score >= best ? " — new best! 🏆" : ""));
    }
  }

  function showOverlay(title, text) {
    overlayTitle.textContent = title;
    overlayText.textContent = text;
    overlay.classList.add("show");
  }

  overlayBtn.addEventListener("click", reset);
  restartBtn.addEventListener("click", reset);

  sizeSel.addEventListener("change", function () {
    SIZE = parseInt(sizeSel.value, 10);
    saveSize();
    reset();
  });

  document.addEventListener("keydown", function (e) {
    var k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A") { e.preventDefault(); move("left"); }
    else if (k === "ArrowRight" || k === "d" || k === "D") { e.preventDefault(); move("right"); }
    else if (k === "ArrowUp" || k === "w" || k === "W") { e.preventDefault(); move("up"); }
    else if (k === "ArrowDown" || k === "s" || k === "S") { e.preventDefault(); move("down"); }
  });

  // Touch swipe
  var touchX = null, touchY = null;
  document.addEventListener("touchstart", function (e) {
    var t = e.touches[0];
    touchX = t.clientX; touchY = t.clientY;
  }, { passive: true });
  document.addEventListener("touchend", function (e) {
    if (touchX === null) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - touchX;
    var dy = t.clientY - touchY;
    var ax = Math.abs(dx), ay = Math.abs(dy);
    if (Math.max(ax, ay) < 20) { touchX = null; touchY = null; return; }
    if (ax > ay) { move(dx > 0 ? "right" : "left"); }
    else { move(dy > 0 ? "down" : "up"); }
    touchX = null; touchY = null;
  }, { passive: true });

  loadBest();
  loadSize();
  reset();
})();
</script>
</body>
</html>
