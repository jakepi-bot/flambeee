<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="flameGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#c2185b"/>
      <stop offset="35%" stop-color="#e94560"/>
      <stop offset="70%" stop-color="#ff5a75"/>
      <stop offset="100%" stop-color="#ffb74d"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f1428"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded-square background -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bgGrad)"/>

  <!-- Subtle inner glow ring -->
  <rect x="40" y="40" width="944" height="944" rx="200" fill="none" stroke="#2a3a6e" stroke-width="8" opacity="0.5"/>

  <!-- Flame body -->
  <path d="M512 200
           C 560 300, 620 360, 640 470
           C 660 580, 620 700, 512 720
           C 404 700, 364 580, 384 470
           C 404 360, 464 300, 512 200 Z"
        fill="url(#flameGrad)"/>

  <!-- Inner flame (lighter core) -->
  <path d="M512 330
           C 540 400, 575 440, 588 505
           C 600 570, 570 650, 512 665
           C 454 650, 424 570, 436 505
           C 449 440, 484 400, 512 330 Z"
        fill="#ffd9a0" opacity="0.9"/>

  <!-- Negative-space F bar -->
  <rect x="470" y="430" width="84" height="34" rx="17" fill="#16213e"/>
  <rect x="470" y="500" width="60" height="30" rx="15" fill="#16213e"/>

  <!-- Wordmark -->
  <text x="512" y="880" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="150" font-weight="700" fill="#eef2ff" letter-spacing="2">flambeee</text>
</svg>
