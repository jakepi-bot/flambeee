  <path d="M230 90
           C 275 175, 325 230, 343 320
           C 361 410, 325 520, 230 540
           C 135 520, 99 410, 117 320
           C 135 230, 185 175, 230 90 Z"
        fill="url(#flameGrad)"/>
  <path d="M230 205
           C 256 265, 287 300, 298 355
           C 309 410, 282 470, 230 482
           C 178 470, 151 410, 162 355
           C 173 300, 204 265, 230 205 Z"
        fill="#ffd9a0" opacity="0.9"/>
  <rect x="196" y="290" width="68" height="28" rx="14" fill="#16213e"/>
  <rect x="196" y="348" width="50" height="24" rx="12" fill="#16213e"/>

  <!-- Wordmark -->
  <text x="440" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="150" font-weight="700" fill="#eef2ff" letter-spacing="2">flambeee</text>
  <text x="442" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="40" font-weight="400" fill="#9aa7d8" letter-spacing="6">web games · zero friction · just play</text>
