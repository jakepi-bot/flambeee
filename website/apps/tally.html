<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<title>Tally | Flambeee Apps</title>
<meta name="description" content="Tally by Flambeee Apps. One running count with a label line. Plus, minus, reset. No accounts, no server.">
<link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
<style>
  :root {
    --bg: #0f1428;
    --bg-2: #16213e;
    --surface: #1a1a2e;
    --surface-2: #1f2a4a;
    --accent: #e94560;
    --accent-2: #ff5a75;
    --text: #eef2ff;
    --text-dim: #9aa7d8;
    --text-mute: #6b76a8;
    --border: #2a3a6e;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  a { color: var(--accent-2); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 24px; width: 100%; }
  header.top { padding: 28px 0 8px; }
  header.top a.back { font-size: 0.9rem; }
  h1 { font-size: clamp(1.8rem, 4vw, 2.4rem); font-weight: 800; margin: 12px 0 4px; }
  .sub { color: var(--text-dim); margin-bottom: 28px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 20px;
  }
  .card h2 {
    font-size: 0.75rem;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent-2);
    margin-bottom: 10px;
  }
  #tallyCount {
    font-size: 2.6rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  #labelLine {
    font-size: 1.1rem;
    color: var(--text-dim);
    margin-top: 8px;
    min-height: 1.75em;
    overflow-wrap: break-word;
  }
  .field-row { display: flex; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
  .field { flex: 1 1 140px; display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 0.85rem; color: var(--text-dim); }
  .field input {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 1rem;
    padding: 12px 14px;
    outline: none;
  }
  .field input:focus { border-color: var(--accent-2); }
  .btn-row { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
  button.action {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 24px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
  }
  button.action:hover { background: var(--accent-2); }
  button.action.secondary { background: var(--surface-2); border: 1px solid var(--border); }
  button.action.secondary:hover { border-color: var(--accent-2); }
  footer { margin-top: auto; padding: 32px 0; text-align: center; color: var(--text-mute); font-size: 0.85rem; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="back" href="../index.html">Back to Flambeee</a>
    <h1>Tally</h1>
    <p class="sub">One running count with a label line. Plus, minus, reset. Flambeee Apps.</p>
  </header>

  <div class="card">
    <h2>Count</h2>
    <div id="tallyCount" aria-live="polite">0</div>
    <div id="labelLine" aria-live="polite"></div>
  </div>

  <div class="card">
    <h2>Setup</h2>
    <div class="field-row">
      <div class="field">
        <label for="nameInput">Label (one line)</label>
        <input id="nameInput" type="text" maxlength="120" placeholder="e.g. Cups of water" autocomplete="off">
      </div>
    </div>
    <div class="btn-row">
      <button class="action" id="plusBtn" type="button">+1</button>
      <button class="action secondary" id="minusBtn" type="button">-1</button>
      <button class="action secondary" id="resetBtn" type="button">Reset</button>
    </div>
  </div>
</div>

<footer>
  <p>Flambeee Apps. No accounts. No server. Your last count stays in this browser.</p>
</footer>

<script>
(function () {
  'use strict';

  /* Story 101 storage key, fixed before first write. Only label plus count persist. */
  var PREFIX = 'flambeee-apps-';
  var TALLY_KEY = PREFIX + 'tally';

  var countEl = document.getElementById('tallyCount');
  var labelEl = document.getElementById('labelLine');
  var nameInput = document.getElementById('nameInput');
  var plusBtn = document.getElementById('plusBtn');
  var minusBtn = document.getElementById('minusBtn');
  var resetBtn = document.getElementById('resetBtn');

  var count = 0;

  function render() {
    countEl.textContent = String(count);
    labelEl.textContent = nameInput.value.trim();
  }

  function save() {
    try {
      localStorage.setItem(TALLY_KEY, JSON.stringify({ label: nameInput.value, count: count }));
    } catch (e) { /* storage unavailable, tally still works */ }
  }

  function load() {
    try {
      var raw = localStorage.getItem(TALLY_KEY);
      if (!raw) return;
      var state = JSON.parse(raw);
      if (state && typeof state.count === 'number' && isFinite(state.count)) {
        count = Math.trunc(state.count);
      }
      if (state && typeof state.label === 'string') {
        nameInput.value = state.label.slice(0, 120);
      }
    } catch (e) { /* keep defaults */ }
  }

  plusBtn.addEventListener('click', function () {
    count += 1;
    render();
    save();
  });

  minusBtn.addEventListener('click', function () {
    count -= 1;
    render();
    save();
  });

  resetBtn.addEventListener('click', function () {
    count = 0;
    render();
    save();
  });

  nameInput.addEventListener('input', function () {
    render();
    save();
  });

  load();
  render();
})();
</script>
</body>
</html>
