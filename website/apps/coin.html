<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<title>Coin Flip | Flambeee Apps</title>
<meta name="description" content="Coin Flip by Flambeee Apps. Call it, flip it. No accounts, no server.">
<link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
<style>
  :root {
    --bg: #0f1428;
    --bg-2: #16213e;
    --surface: #1a1a2e;
    --surface-2: #1f2a4a;
    --accent: #e94560;
    --accent-2: #ff5a75;
    --text: #eef2ff;
    --text-dim: #9aa7d8;
    --text-mute: #6b76a8;
    --border: #2a3a6e;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  a { color: var(--accent-2); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 24px; width: 100%; }
  header.top { padding: 28px 0 8px; }
  header.top a.back { font-size: 0.9rem; }
  h1 { font-size: clamp(1.8rem, 4vw, 2.4rem); font-weight: 800; margin: 12px 0 4px; }
  .sub { color: var(--text-dim); margin-bottom: 28px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 20px;
  }
  .card h2 {
    font-size: 0.75rem;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent-2);
    margin-bottom: 10px;
  }
  #coinResult {
    font-size: 2.6rem;
    font-weight: 800;
  }
  #labelLine {
    font-size: 1.1rem;
    color: var(--text-dim);
    margin-top: 8px;
    min-height: 1.75em;
    overflow-wrap: break-word;
  }
  .field-row { display: flex; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
  .field { flex: 1 1 140px; display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 0.85rem; color: var(--text-dim); }
  .field input {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 1rem;
    padding: 12px 14px;
    outline: none;
  }
  .field input:focus { border-color: var(--accent-2); }
  .btn-row { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
  button.action {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 24px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
  }
  button.action:hover { background: var(--accent-2); }
  #coinStatus { color: var(--text-mute); font-size: 0.85rem; margin-top: 12px; min-height: 1.4em; }
  footer { margin-top: auto; padding: 32px 0; text-align: center; color: var(--text-mute); font-size: 0.85rem; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="back" href="../index.html">Back to Flambeee</a>
    <h1>Coin Flip</h1>
    <p class="sub">Call it, flip it. Flambeee Apps.</p>
  </header>

  <div class="card">
    <h2>Last flip</h2>
    <div id="coinResult" aria-live="polite">-</div>
    <div id="labelLine" aria-live="polite"></div>
  </div>

  <div class="card">
    <h2>Setup</h2>
    <div class="field-row">
      <div class="field">
        <label for="callInput">Your call (heads or tails)</label>
        <input id="callInput" type="text" value="heads" maxlength="6" autocomplete="off" spellcheck="false">
      </div>
    </div>
    <div class="btn-row">
      <button class="action" id="flipBtn" type="button">Flip</button>
    </div>
    <p id="coinStatus" aria-live="polite"></p>
  </div>
</div>

<footer>
  <p>Flambeee Apps. No accounts. No server. Your last flip stays in this browser.</p>
</footer>

<script>
(function () {
  'use strict';

  /* Story 106 storage key, fixed before first write. Only call plus last flip persist. */
  var PREFIX = 'flambeee-apps-';
  var COIN_KEY = PREFIX + 'coin';

  var resultEl = document.getElementById('coinResult');
  var labelEl = document.getElementById('labelLine');
  var callInput = document.getElementById('callInput');
  var flipBtn = document.getElementById('flipBtn');
  var statusEl = document.getElementById('coinStatus');

  var lastFlip = null;

  function parseCall(raw) {
    var v = String(raw).trim().toLowerCase();
    if (v !== 'heads' && v !== 'tails') v = 'heads';
    return v;
  }

  function invalidCall(raw) {
    var t = String(raw).trim().toLowerCase();
    return t !== 'heads' && t !== 'tails';
  }

  function readCall() {
    var bad = invalidCall(callInput.value);
    var v = parseCall(callInput.value);
    if (bad) {
      callInput.value = v;
      statusEl.textContent = 'Call heads or tails. Using ' + v + '.';
    }
    return v;
  }

  function render(call) {
    resultEl.textContent = (lastFlip === null) ? '-' : lastFlip;
    labelEl.textContent = (lastFlip === null) ? '' : ('called ' + call + ', flipped ' + lastFlip);
  }

  function save(call) {
    try {
      localStorage.setItem(COIN_KEY, JSON.stringify({ call: call, last: lastFlip }));
    } catch (e) { /* storage unavailable, coin still works */ }
  }

  function load() {
    try {
      var raw = localStorage.getItem(COIN_KEY);
      if (!raw) return 'heads';
      var state = JSON.parse(raw);
      var call = 'heads';
      if (state && (state.call === 'heads' || state.call === 'tails')) {
        call = state.call;
      }
      if (state && (state.last === 'heads' || state.last === 'tails')) {
        lastFlip = state.last;
      }
      return call;
    } catch (e) { return 'heads'; }
  }

  flipBtn.addEventListener('click', function () {
    statusEl.textContent = '';
    var call = readCall();
    lastFlip = (Math.random() < 0.5) ? 'heads' : 'tails';
    if (lastFlip === call) {
      statusEl.textContent = 'Your call was right.';
    } else {
      statusEl.textContent = 'Your call was wrong.';
    }
    render(call);
    save(call);
  });

  callInput.addEventListener('change', function () {
    var call = readCall();
    save(call);
  });

  var startCall = load();
  callInput.value = startCall;
  render(startCall);
})();
</script>
</body>
</html>
