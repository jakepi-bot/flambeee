<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🔥 Flambeee Simon</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --cell: #0f3460;
      --accent: #e94560;
      --text: #eee;
      --border: #222;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      touch-action: manipulation; /* no double-tap zoom, no 300ms tap delay (iOS) */
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    .back-link {
      position: absolute;
      top: 20px;
      left: 20px;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      opacity: 0.7;
      transition: opacity 0.2s;
    }

    .back-link:hover {
      opacity: 1;
    }

    h1 {
      margin: 40px 0 20px;
      font-size: 2rem;
      text-align: center;
    }

    .stats {
      display: flex;
      gap: 30px;
      margin-bottom: 20px;
      font-size: 1.1rem;
    }

    .stat {
      background: var(--surface);
      padding: 10px 20px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .stat-label {
      font-size: 0.85rem;
      opacity: 0.7;
      display: block;
      margin-bottom: 4px;
    }

    .stat-value {
      font-weight: bold;
      font-size: 1.3rem;
    }

    .game-board {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin: 30px 0;
      padding: 20px;
      background: var(--surface);
      border-radius: 16px;
      border: 1px solid var(--border);
    }

    .pad {
      width: 120px;
      height: 120px;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      transition: all 0.1s ease;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      opacity: 0.85;
      touch-action: manipulation;
    }

    /* Colorblind cue symbols */
    .pad.green::after { content: '●'; }
    .pad.red::after { content: '▲'; }
    .pad.yellow::after { content: '■'; }
    .pad.blue::after { content: '◆'; }
    .pad.lit::after { opacity: 0.4; }

    .pad:active {
      transform: scale(0.95);
    }

    .pad:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    /* Pad colors - inactive state */
    .pad.green { background: #1a5a3a; color: #2a7a4a; }
    .pad.red { background: #5a1a2a; color: #7a2a3a; }
    .pad.yellow { background: #5a4a1a; color: #7a6a2a; }
    .pad.blue { background: #1a3a5a; color: #2a4a7a; }

    /* Pad colors - active/lit state */
    .pad.green.lit { 
      background: #4e9;
      box-shadow: 0 0 30px #4e9, 0 0 60px #4e9;
    }
    .pad.red.lit { 
      background: #e94560;
      box-shadow: 0 0 30px #e94560, 0 0 60px #e94560;
    }
    .pad.yellow.lit { 
      background: #ff9;
      box-shadow: 0 0 30px #ff9, 0 0 60px #ff9;
    }
    .pad.blue.lit { 
      background: #6cf;
      box-shadow: 0 0 30px #6cf, 0 0 60px #6cf;
    }

    .controls {
      margin-top: 20px;
    }

    /* Difficulty selector */
    .difficulty {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .difficulty button {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    .difficulty button:hover, .difficulty button.active {
      background: var(--cell);
      border-color: var(--accent);
    }

    .btn {
      background: var(--cell);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 12px 30px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
    }

    .btn:hover {
      background: var(--accent);
      border-color: var(--accent);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
    }

    /* Game Over Overlay */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .overlay-content {
      background: var(--surface);
      padding: 40px 60px;
      border-radius: 16px;
      text-align: center;
      border: 1px solid var(--border);
      max-width: 90%;
    }

    .overlay h2 {
      font-size: 2rem;
      margin-bottom: 10px;
      color: var(--accent);
    }

    .overlay .score-display {
      font-size: 1.5rem;
      margin: 20px 0;
    }

    .overlay .final-score {
      font-size: 3rem;
      font-weight: bold;
      color: var(--accent);
      display: block;
      margin: 10px 0;
    }

    .overlay .new-best {
      color: #4e9;
      font-size: 1.2rem;
      margin-top: 15px;
      display: none;
    }

    .overlay .new-best.show {
      display: block;
    }

    /* Mobile responsive */
    @media (max-width: 400px) {
      .game-board {
        gap: 15px;
        padding: 15px;
      }

      .pad {
        width: 100px;
        height: 100px;
        border-radius: 16px;
      }

      h1 {
        font-size: 1.5rem;
      }

      .stats {
        gap: 15px;
      }

      .stat {
        padding: 8px 15px;
      }
    }
  </style>
</head>
<body>
  <a href="index.html" class="back-link">← Back to Games</a>

  <h1>🔥 Flambeee Simon</h1>

  <div class="stats">
    <div class="stat">
      <span class="stat-label">Round</span>
      <span class="stat-value" id="round">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">Best</span>
      <span class="stat-value" id="best">0</span>
    </div>
  </div>

  <div class="difficulty">
    <button data-diff="easy">Easy</button>
    <button data-diff="classic" class="active">Classic</button>
    <button data-diff="hard">Hard</button>
  </div>

  <div class="game-board">
    <button class="pad green" data-color="green" data-freq="329.63" aria-label="Green pad"></button>
    <button class="pad red" data-color="red" data-freq="261.63" aria-label="Red pad"></button>
    <button class="pad yellow" data-color="yellow" data-freq="220" aria-label="Yellow pad"></button>
    <button class="pad blue" data-color="blue" data-freq="440" aria-label="Blue pad"></button>
  </div>

  <div class="controls">
    <button class="btn btn-primary" id="startBtn">Start Game</button>
  </div>

  <div class="overlay" id="overlay">
    <div class="overlay-content">
      <h2>Game Over!</h2>
      <div class="score-display">
        You reached round
        <span class="final-score" id="finalScore">0</span>
      </div>
      <p class="new-best" id="newBest">🎉 New Best Score!</p>
      <button class="btn btn-primary" id="playAgainBtn">Play Again</button>
    </div>
  </div>

  <script>
    // Game state
    let sequence = [];
    let playerIndex = 0;
    let round = 0;
    let difficulty = 'classic';
    let bestScore = 0;
    let isPlayingSequence = false;
    let audioContext = null;
    let gameGen = 0; // bumped on every startGame; stale sequence loops abort

    // Difficulty presets: { flash, gap, flashStep, gapStep, flashFloor, gapFloor }
    const DIFFICULTIES = {
      easy:   { flash: 800, gap: 300, flashStep: 20, gapStep: 10, flashFloor: 350, gapFloor: 120 },
      classic: { flash: 600, gap: 200, flashStep: 30, gapStep: 10, flashFloor: 200, gapFloor: 80 },
      hard:   { flash: 450, gap: 150, flashStep: 40, gapStep: 15, flashFloor: 120, gapFloor: 50 }
    };

    const DIFF_KEY = 'flambeee-simon-difficulty';
    const BEST_KEY = 'flambeee-simon-best';
    const STATS_KEY = 'flambeee-stats-simon';

    // DOM elements
    const pads = document.querySelectorAll('.pad');
    const startBtn = document.getElementById('startBtn');
    const playAgainBtn = document.getElementById('playAgainBtn');
    const roundDisplay = document.getElementById('round');
    const bestDisplay = document.getElementById('best');
    const overlay = document.getElementById('overlay');
    const finalScoreDisplay = document.getElementById('finalScore');
    const newBestDisplay = document.getElementById('newBest');
    const diffButtons = document.querySelectorAll('.difficulty button');

    // --- Stats helpers (localStorage, private-mode safe) ---
    function loadStats() {
      try {
        const raw = localStorage.getItem(STATS_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) { /* private mode */ }
      return { plays: 0, wins: 0 };
    }

    function saveStats(stats) {
      try { localStorage.setItem(STATS_KEY, JSON.stringify(stats)); } catch (e) { /* private mode */ }
    }

    function recordGame() {
      const stats = loadStats();
      stats.plays += 1;
      saveStats(stats);
    }

    // --- Difficulty ---
    function loadDifficulty() {
      try {
        const d = localStorage.getItem(DIFF_KEY);
        if (d === 'easy' || d === 'classic' || d === 'hard') difficulty = d;
      } catch (e) { /* private mode */ }
      diffButtons.forEach(b => b.classList.toggle('active', b.dataset.diff === difficulty));
    }

    function saveDifficulty() {
      try { localStorage.setItem(DIFF_KEY, difficulty); } catch (e) { /* private mode */ }
    }

    function bestKey() {
      return difficulty === 'classic' ? BEST_KEY : BEST_KEY + '-' + difficulty;
    }

    function loadBest() {
      try { bestScore = parseInt(localStorage.getItem(bestKey()), 10) || 0; } catch (e) { bestScore = 0; }
      bestDisplay.textContent = bestScore;
    }

    diffButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        difficulty = btn.dataset.diff;
        diffButtons.forEach(b => b.classList.toggle('active', b.dataset.diff === difficulty));
        saveDifficulty();
        loadBest();
        startGame();
      });
    });

    // Initialize best score display
    loadDifficulty();
    loadBest();

    // Audio context initialization
    function initAudio() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    // Play tone for a pad
    function playTone(freq, duration = 0.3) {
      initAudio();
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();

      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);

      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(freq, audioContext.currentTime);

      gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);

      oscillator.start(audioContext.currentTime);
      oscillator.stop(audioContext.currentTime + duration);
    }

    // Speed scaling — gets faster as rounds increase, per difficulty
    function getFlashDuration() {
      const d = DIFFICULTIES[difficulty];
      return Math.max(d.flashFloor, d.flash - (round - 1) * d.flashStep);
    }

    function getGapDuration() {
      const d = DIFFICULTIES[difficulty];
      return Math.max(d.gapFloor, d.gap - (round - 1) * d.gapStep);
    }

    // Flash a pad
    function flashPad(pad, duration, gap) {
      return new Promise(resolve => {
        pad.classList.add('lit');
        playTone(parseFloat(pad.dataset.freq), duration / 1000);

        setTimeout(() => {
          pad.classList.remove('lit');
          setTimeout(resolve, gap);
        }, duration);
      });
    }

    // Play the sequence
    async function playSequence() {
      const gen = gameGen;
      isPlayingSequence = true;
      disablePads(true);

      const flashDur = getFlashDuration();
      const gapDur = getGapDuration();

      for (let i = 0; i < sequence.length; i++) {
        if (gen !== gameGen) return; // game was reset mid-sequence
        await flashPad(pads[sequence[i]], flashDur, gapDur);
      }

      if (gen !== gameGen) return;
      isPlayingSequence = false;
      disablePads(false);
    }

    // Disable/enable pads
    function disablePads(disabled) {
      pads.forEach(pad => {
        pad.disabled = disabled;
      });
    }

    // Add a new step to the sequence
    function addToSequence() {
      sequence.push(Math.floor(Math.random() * 4));
    }

    // Start game
    function startGame() {
      gameGen++;
      initAudio();
      sequence = [];
      playerIndex = 0;
      round = 0;
      roundDisplay.textContent = '—';
      overlay.classList.remove('show');
      startBtn.style.display = 'none';

      nextRound();
    }

    // Next round
    async function nextRound() {
      playerIndex = 0;
      addToSequence();
      round = sequence.length;
      roundDisplay.textContent = round;
      await playSequence();
    }

    // Handle pad click
    function handlePadClick(e) {
      if (isPlayingSequence) return;

      const pad = e.target;
      const color = pad.dataset.color;
      const freq = parseFloat(pad.dataset.freq);
      const padIndex = Array.from(pads).indexOf(pad);

      // Play tone and flash
      pad.classList.add('lit');
      playTone(freq);
      setTimeout(() => pad.classList.remove('lit'), 300);

      // Check if correct
      if (padIndex === sequence[playerIndex]) {
        playerIndex++;

        // Completed the sequence
        if (playerIndex >= sequence.length) {
          disablePads(true);
          setTimeout(nextRound, 500);
        }
      } else {
        // Wrong! Game over
        gameOver();
      }
    }

    // Game over
    function gameOver() {
      const isNewBest = round > bestScore;

      if (isNewBest) {
        bestScore = round;
        try { localStorage.setItem(bestKey(), bestScore); } catch (e) { /* private mode */ }
        bestDisplay.textContent = bestScore;
      }

      recordGame();
      finalScoreDisplay.textContent = round;
      newBestDisplay.classList.toggle('show', isNewBest);
      overlay.classList.add('show');
      startBtn.style.display = 'none';
    }

    // Event listeners
    pads.forEach(pad => {
      pad.addEventListener('click', handlePadClick);
    });

    startBtn.addEventListener('click', startGame);
    playAgainBtn.addEventListener('click', startGame);

    // Keyboard support
    document.addEventListener('keydown', (e) => {
      if (isPlayingSequence) return;

      const keyMap = {
        'q': 0, // green (top-left)
        'w': 1, // red (top-right)
        'a': 2, // yellow (bottom-left)
        's': 3  // blue (bottom-right)
      };

      if (keyMap.hasOwnProperty(e.key.toLowerCase()) && !pads[0].disabled) {
        const padIndex = keyMap[e.key.toLowerCase()];
        pads[padIndex].click();
      }
    });
  </script>
</body>
</html>
